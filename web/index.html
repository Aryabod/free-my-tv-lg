<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div id="wx">
      <div class="photo pa"></div><div class="photo pb"></div>
      <div class="sun"></div>
      <div class="st1"></div><div class="st2"></div><div class="st3"></div><div class="shoot"></div>
      <div class="fog f1"></div><div class="fog f2"></div><div class="haze"></div>
      <div class="rain p2"></div><div class="rain p1"></div>
      <div class="snowsway b"><div class="s2f"></div></div><div class="snowsway a"><div class="s1f"></div></div>
      <div class="flash"></div>
      <div class="grain"></div>
    </div>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="greet"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
      <div id="nowwx"></div>
    </div>
    <div id="platter"></div>
    <div id="halo"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="citypick" class="layer sheet"><div class="box"></div></div>
  <div id="keypick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="dim" class="layer"></div>
  <div id="ambient" class="layer"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
